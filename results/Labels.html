<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>TextContrast</title>
  <style>
    html, body { margin: 0; height: 100%; background: #F9F9F9; }
    p { position: absolute; left: 20px; margin: 0; font-family: "Segoe UI"; color: #000000; white-space: nowrap; }
  </style>
  <script>document.title = decodeURIComponent(location.hash.slice(1)) || document.title;</script>
</head>
<body>
  <p style="top: 20px; font-size: 12px">Customer number:</p>
  <p style="top: 50px; font-size: 12px">&#163;4,070.00 in 3 unpaid invoices</p>
  <p style="top: 80px; font-size: 12px">The quick brown fox jumps over the lazy dog</p>
  <p style="top: 110px; font-size: 8px">Customer number:</p>
  <p style="top: 140px; font-size: 10px">Customer number:</p>
  <p style="top: 170px; font-size: 12px">Customer number:</p>
  <p style="top: 200px; font-size: 14px">Customer number:</p>
  <p style="top: 230px; font-size: 16px">Customer number:</p>
  <p style="top: 262px; font-size: 20px">Customer number:</p>
  <p style="top: 302px; font-size: 28px">Customer number:</p>
</body>
</html>
